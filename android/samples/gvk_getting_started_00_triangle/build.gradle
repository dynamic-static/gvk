plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gvk.getting_started_00_triangle'
    compileSdk 37
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId 'com.gvk.getting_started_00_triangle'
        minSdk 24
        targetSdk 37
        versionCode 1
        versionName '1.0'

        externalNativeBuild {
            cmake {
                // NOTE : arm64-v8a only for now, matching every gvk Android cross-compile
                //   tested so far.  Add more ABIs once this one is proven.
                abiFilters 'arm64-v8a'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.30.1'
        }
    }

    buildFeatures {
        prefab true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.games:games-activity:4.0.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
